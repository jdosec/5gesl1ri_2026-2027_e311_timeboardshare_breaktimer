# Publie le ScreenTimer sur GitLab Pages à chaque push sur la branche principale
pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html style.css script.js public/
    - if [ -f config.json ]; then cp config.json public/; fi
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
